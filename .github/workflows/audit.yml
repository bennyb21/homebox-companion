name: Dependency audit

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.10"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "26.12.1"
      - run: uv sync --locked --all-groups
      - name: Audit Python dependencies
        run: uv run --no-sync pip-audit --local --skip-editable
      - name: Test fail-closed frontend audit policy (offline)
        if: success() || failure()
        run: uv run --no-sync pytest tests/test_frontend_audit_policy.py
      - name: Audit frontend dependencies with explicit pilot policy
        if: success() || failure()
        run: bash scripts/audit-frontend.sh audit-results
      - name: Preserve raw audit and policy decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-audit-${{ github.job }}
          path: audit-results/
          if-no-files-found: error
          retention-days: 90
